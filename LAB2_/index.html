<!DOCTYPE html>
<html lang="es">
<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Constrase;a</title>

    


    <link rel="stylesheet" href="style.css">
</head>

<body>
   

    <div class="contenedor">

        <h2>Generador de Contraseña</h2>

        <div class="contraseña">
            <input type="text" id="resultado" readonly>
            <button class="copiar" onclick="copiarContraseña()">copiar</button>
        </div>



        <div class="opciones">
            <label for="longitud">Tamaño de la contraseña</label>
            <input type="number" id="longitud" value="20" min="1" max="50">
        </div>



        <div class="opciones">
            <label for="mayusculas">Se incluyen letras mayúsculas</label>
            <input type="checkbox" id="mayusculas">
        </div>



        <div class="opciones">
            <label for="minusculas">Se incluyen letras minúsculas</label>
            <input type="checkbox" id="minusculas" checked>
        </div>



        <div class="opciones">
            <label for="numeros">Se incluyen números</label>
            <input type="checkbox" id="numeros">
        </div>



        <div class="opciones">
            <label for="simbolos">Se incluyen símbolos</label>
            <input type="checkbox" id="simbolos" checked>
        </div>




        
        <button class="generar" onclick="generarContraseña()">
        Generar contraseña
        </button>
        
    </div>



    <script src="scrip.js"></script>

</body>
</html>
